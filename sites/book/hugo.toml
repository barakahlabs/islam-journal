baseURL = "https://barakahlabs.github.io/blog/book/"
title = "Book"

enableRobotsTXT = true
enableGitInfo = false

pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"
    noClasses = false

[outputs]
  home = ["HTML", "print", "RSS"]
  section = ["HTML", "print", "RSS"]

[params]
  privacy_policy = ""
  github_repo = "https://github.com/barakahlabs/blog"
  github_subdir = "sites/book"
  github_branch = "main"
  offlineSearch = false
  prism_syntax_highlighting = false

  [params.copyright]
    authors = "Sirajul"
    from_year = 2026

  [params.ui]
    breadcrumb_disable = false
    navbar_logo = false
    sidebar_menu_foldable = true
    sidebar_menu_compact = false
    sidebar_search_disable = false
    showLightDarkModeMenu = true

    [params.ui.feedback]
      enable = false

    [params.ui.readingtime]
      enable = true

  btn-lg = 'class="btn btn-lg btn-{1}" role="button"'
  FA = '<i class="fa-{1} fa-{2} text-{3} px-1"></i>'

[module]
  [module.hugoVersion]
    extended = true
    min = "0.160.1"
  [[module.imports]]
    path = "github.com/google/docsy/theme"
